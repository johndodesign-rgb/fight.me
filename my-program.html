<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>My Program · fit.me</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,700;0,900;1,700&family=Barlow:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --black: #060606;
    --ink: #0c0c0c;
    --card: #111;
    --card2: #161616;
    --line: #1a1a1a;
    --line2: #242424;
    --line3: #303030;
    --white: #edeae4;
    --dim: #777;
    --muted: #3a3a3a;
    --punch: #e8311a;
    --punch-dim: #4a0f07;
    --amber: #c97b1a;
    --green: #28b05a;
    --blue: #2a7ab8;
    --purple: #7a2ab8;
    --mono: 'DM Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'Barlow', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--black);
    color: var(--white);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.018;
    pointer-events: none;
    z-index: 9999;
  }

  /* NAV */
  nav {
    padding: 48px 20px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(6,6,6,0.95);
    backdrop-filter: blur(8px);
    z-index: 50;
  }

  .nav-logo {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 900;
  }

  .nav-logo span { color: var(--green); }

  .nav-back {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    transition: color 0.15s;
  }

  .nav-back:hover { color: var(--white); }

  /* PROGRAM HEADER */
  .program-header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--ink);
  }

  .program-header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .program-title {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
  }

  .program-meta-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .meta-pill {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
    border: 1px solid;
  }

  .pill-track-foundation { background: rgba(232,49,26,0.1); color: var(--punch); border-color: rgba(232,49,26,0.3); }
  .pill-track-transition  { background: rgba(201,123,26,0.1); color: var(--amber); border-color: rgba(201,123,26,0.3); }
  .pill-track-fighter     { background: rgba(40,176,90,0.1);  color: var(--green); border-color: rgba(40,176,90,0.3); }
  .pill-equipment { background: var(--card); color: var(--dim); border-color: var(--line2); }
  .pill-week      { background: var(--card); color: var(--dim); border-color: var(--line2); }

  .program-description {
    font-size: 12px;
    color: var(--dim);
    line-height: 1.7;
  }

  .program-description strong { color: var(--white); font-weight: 500; }

  /* ADJUSTMENT NOTICE */
  .adjustment-notice {
    margin: 0 20px;
    margin-top: 16px;
    background: rgba(201,123,26,0.08);
    border: 1px solid rgba(201,123,26,0.3);
    border-radius: 3px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 12px;
    color: var(--amber);
    line-height: 1.5;
  }

  .adjustment-notice strong { color: var(--white); font-weight: 500; display: block; margin-bottom: 2px; }

  /* CARRY NOTE */
  .carry-note {
    margin: 0 20px;
    margin-top: 12px;
    background: rgba(201,123,26,0.05);
    border: 1px solid rgba(201,123,26,0.2);
    border-left: 3px solid var(--amber);
    border-radius: 0 3px 3px 0;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.7;
  }

  .carry-note strong { color: var(--white); font-weight: 500; }

  /* DAY TABS */
  .day-tabs {
    display: flex;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    padding: 0 20px;
    gap: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    white-space: nowrap;
    transition: all 0.15s;
    position: relative;
  }

  .day-tab:hover { color: var(--dim); }
  .day-tab.active { color: var(--white); border-bottom-color: var(--punch); }

  .day-tab .tab-type-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  .dot-strength { background: var(--punch); }
  .dot-cardio   { background: var(--green); }
  .dot-mobility { background: #b87aff; }
  .dot-rest     { background: var(--muted); }

  /* DAY CONTENT */
  .day-contents { display: none; padding: 20px; }
  .day-contents.active { display: block; }

  /* REST DAY */
  .rest-day {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }

  .rest-day-icon { font-size: 40px; margin-bottom: 12px; }
  .rest-day-title {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .rest-day-sub { font-size: 12px; color: var(--muted); }

  /* SESSION HEADER */
  .session-header {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .session-type-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .session-type-label.strength { color: var(--punch); }
  .session-type-label.cardio   { color: var(--green); }
  .session-type-label.mobility { color: #b87aff; }

  .session-name {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 8px;
  }

  .session-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
  }

  /* EXERCISE CARDS */
  .exercises-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .exercise-card {
    background: var(--card);
    border: 1px solid var(--line2);
    border-radius: 3px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .exercise-card.adjusted {
    border-color: rgba(201,123,26,0.4);
    background: rgba(201,123,26,0.04);
  }

  .exercise-card-header {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid var(--line);
  }

  .exercise-card-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .pattern-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .exercise-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .exercise-role {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }

  .adj-tag {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--amber);
    background: rgba(201,123,26,0.12);
    border: 1px solid rgba(201,123,26,0.3);
    padding: 2px 6px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .exercise-card-body {
    padding: 10px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .exercise-stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat-val {
    font-size: 12px;
    color: #ccc;
    line-height: 1.3;
  }

  .exercise-card-note {
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--amber);
    font-style: italic;
    line-height: 1.5;
  }

  .combat-value {
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }

  .combat-value::before {
    content: '🥊';
    font-size: 10px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* LOG BUTTON */
  .log-btn {
    font-family: var(--display);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--punch);
    color: var(--white);
    border: none;
    padding: 16px;
    width: 100%;
    cursor: pointer;
    transition: background 0.15s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    margin-top: 8px;
  }

  .log-btn:hover { background: #ff3d20; }
  .log-btn:active { transform: scale(0.99); }
  .log-btn.logged { background: var(--green); cursor: default; }

  /* WEEK OVERVIEW STRIP */
  .week-strip {
    display: flex;
    gap: 4px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .week-strip::-webkit-scrollbar { display: none; }

  .week-strip-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 3px;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .week-strip-day:hover { background: var(--card); }
  .week-strip-day.active { background: var(--card); border-color: var(--line2); }

  .wsd-name {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .wsd-block {
    width: 32px; height: 32px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .wsd-strength { background: rgba(232,49,26,0.15); }
  .wsd-cardio   { background: rgba(40,176,90,0.15); }
  .wsd-mobility { background: rgba(122,42,184,0.15); }
  .wsd-rest     { background: var(--line); }

  .wsd-type {
    font-family: var(--mono);
    font-size: 7px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: center;
  }
</style>
</head>

<script>
// ─────────────────────────────────────────────

  function getSessionName(track, sessionType, weekNum) {
    const pool = SESSION_NAMES[track]?.[sessionType];
    if (!pool || pool.length === 0) return null;
    // Seed with week number for consistency within a week
    // but variety across weeks
    const idx = (weekNum * 7 + sessionType.length) % pool.length;
    return pool[idx];
  }

  // ── EXERCISE LIBRARY ──
  // Condensed from fitme-exercise-library.xlsx
  // Fields: name, pattern, equipment, minTrack, complexity, bilateral, ballistic, repRange, setRange, tempo, regression, progression, combatValue

    // ── PUSH ──

    // ── PULL ──
    { name:'DB Bent Row',           pattern:'pull',   equipment:['Dumbbells'],             minTrack:0, complexity:1, bilateral:true,  ballistic:false, repRange:'8–12', sets:'3–4', tempo:'2-1-1', regression:'Band Row',            progression:'Single-Arm DB Row',     combatValue:'Back strength — clinch, punch retraction' },
    { name:'Single-Arm DB Row',     pattern:'pull',   equipment:['Dumbbells'],             minTrack:0, complexity:1, bilateral:false, ballistic:false, repRange:'8–10/side', sets:'3–4', tempo:'2-1-1', regression:'Band Row', progression:'Dead Stop SA Row',      combatValue:'Unilateral — punch retraction speed' },
    { name:'Band Pull-Apart',       pattern:'pull',   equipment:['Band'],                  minTrack:0, complexity:1, bilateral:true,  ballistic:false, repRange:'15–20', sets:'2–3', tempo:'Controlled', regression:'Lighter band', progression:'Band Pull-Apart + Rotation', combatValue:'Shoulder health — sustained guard' },

  // ── TRACK LEVELS ──
  const TRACK_LEVEL = { foundation: 0, transition: 1, fighter: 2 };

  // ── ISOLATION EXERCISE MAP ──
  // Keyed by muscle group, filtered by equipment
  const ISOLATION_MAP = {
    bicep: [
      { name: 'DB Curl',        equipment: ['Dumbbells'], repRange: '10–15', sets: '2', tempo: 'Full range, squeeze at top', combatValue: 'Bicep endurance — sustained guard and hook power' },
      { name: 'Hammer Curl',    equipment: ['Dumbbells'], repRange: '10–15', sets: '2', tempo: 'Neutral grip, controlled',   combatValue: 'Brachialis — wrist stability when punching' },

    ],
    tricep: [
      { name: 'Tricep Kickback',     equipment: ['Dumbbells'], repRange: '12–15', sets: '2', tempo: 'Full extension',         combatValue: 'Tricep endurance — sustained punching output' },

      { name: 'Tricep Dip',          equipment: ['Bodyweight'],repRange: '8–15',  sets: '2', tempo: 'Controlled',             combatValue: 'Tricep strength — bodyweight option' },
    ],
    shoulder: [
      { name: 'Lateral Raise',   equipment: ['Dumbbells'], repRange: '12–15', sets: '2', tempo: 'Controlled arc',    combatValue: 'Medial deltoid — lateral guard endurance' },
      { name: 'DB Shrug',        equipment: ['Dumbbells'], repRange: '12–15', sets: '2', tempo: 'Hold 1 sec at top', combatValue: 'Trap and neck — taking punches, clinch' },
    ],
    hamstring: [
      { name: 'Band Leg Curl',   equipment: ['Band'],      repRange: '12–15', sets: '2', tempo: 'Full range',        combatValue: 'Hamstring isolation — posterior knee stability' },
      { name: 'Glute Bridge',    equipment: ['Bodyweight'],repRange: '15–20', sets: '2', tempo: 'Hold 2 sec top',    combatValue: 'Glute activation — foundational hip extension' },
    ],
  };

  function pickIsolation(muscleGroup, equipmentTier) {
    const allowed = EQUIPMENT[equipmentTier] || EQUIPMENT.dumbbells;
    const pool = (ISOLATION_MAP[muscleGroup] || []).filter(ex =>
      ex.equipment.some(e => allowed.some(a => a.toLowerCase() === e.toLowerCase()))
    );
    if (pool.length === 0) return null;
    return { ...pool[0], pattern: 'pull', role: 'Isolation', adjusted: false };
  }

  // ── EQUIPMENT FILTER ──
  function equipmentAllowed(exercise, tier) {
    const allowed = EQUIPMENT[tier] || EQUIPMENT.dumbbells;
    return exercise.equipment.every(e => allowed.some(a => a.toLowerCase() === e.toLowerCase()));
  }

  // ── TRACK FILTER ──
  function trackAllowed(exercise, track) {
    return exercise.minTrack <= TRACK_LEVEL[track];
  }

  // ── FILTER LIBRARY ──
  function filterLibrary(track, equipmentTier) {
    return LIBRARY.filter(ex =>
      trackAllowed(ex, track) &&
      equipmentAllowed(ex, equipmentTier)
    );
  }

  // ── PATTERN PICKER ──
  // Returns exercises for a pattern, sorted by complexity (prefer simpler at Foundation)
  function pickForPattern(pattern, track, equipmentTier, bilateral = null, ballistic = null, count = 1) {
    let pool = filterLibrary(track, equipmentTier)
      .filter(ex => ex.pattern === pattern);

    if (bilateral !== null) pool = pool.filter(ex => ex.bilateral === bilateral);
    if (ballistic !== null) pool = pool.filter(ex => ex.ballistic === ballistic);

    // Sort: prefer lower complexity at Foundation, higher at Fighter
    const level = TRACK_LEVEL[track];
    pool.sort((a, b) => level === 0 ? a.complexity - b.complexity : b.complexity - a.complexity);

    return pool.slice(0, count);
  }

  // ── DYNAMIC ADJUSTMENTS ──
  // Apply lever adjustments based on session log signals
  function applyAdjustments(exercise, sessionLogs, pattern) {
    const patternLogs = (sessionLogs || [])
      .filter(log => log.pattern === pattern)
      .slice(-6); // last 6 sessions of this pattern

    if (patternLogs.length < 3) return exercise; // not enough data

    const avgFeel = patternLogs.reduce((a, b) => a + b.feel, 0) / patternLogs.length;

    let adjusted = { ...exercise, adjusted: false, adjustmentNote: null };

    if (avgFeel < 1.5) {
      // Too hard — apply regression lever
      if (exercise.regression) {
        const regression = LIBRARY.find(e => e.name === exercise.regression);
        if (regression) {
          adjusted = { ...regression, adjusted: true, adjustmentNote: `Adjusted from ${exercise.name} — building up` };
        }
      }
    } else if (avgFeel > 2.5) {
      // Too easy — apply progression levers
      // Lever 1: bump rep range first
      const [low, high] = exercise.repRange.replace('/side','').split('–').map(Number);
      if (!isNaN(low) && !isNaN(high) && high < 20) {
        adjusted.repRange = `${low + 2}–${high + 3}`;
        adjusted.adjusted = true;
        adjusted.adjustmentNote = 'Rep range increased — keep progressing';
      } else if (exercise.progression) {
        // Lever 3: swap to progression exercise
        const progression = LIBRARY.find(e => e.name === exercise.progression);
        if (progression) {
          adjusted = { ...progression, adjusted: true, adjustmentNote: `Progressed from ${exercise.name} — ready for more` };
        }
      }
    }

    return adjusted;
  }

  // ── GENERATE SESSION ──
  // Generates one of three session types
  function generateSession(type, track, equipmentTier, weekNum, sessionLogs) {
    const sessions = {

      // Monday: Push / Pull / Hinge — bilateral primary
      A: () => {
        const phase = weekNum <= 4 ? 1 : weekNum <= 8 ? 2 : 3;
        const push  = pickForPattern('push',  track, equipmentTier, true,  false, 1)[0];
        const pull  = pickForPattern('pull',  track, equipmentTier, true,  false, 1)[0];
        const hinge = pickForPattern('hinge', track, equipmentTier, true,  false, 1)[0];
        const carry = pickForPattern('carry', track, equipmentTier, null,  null,  1)[0];
        const iso1  = pickIsolation('tricep', equipmentTier); // tricep after push day
        const iso2  = pickIsolation('bicep',  equipmentTier); // bicep after pull day

        const nameA = getSessionName(track, 'A', weekNum) || 'Push · Pull · Hinge';
        return {
          name: nameA,
          type: 'strength',
          day: 'Monday',
          phase,
          exercises: [
            push  && { ...applyAdjustments(push,  sessionLogs, 'push'),  role: 'Primary',   sets: phase === 1 ? '3' : phase === 2 ? '4' : '4', tempo: phase === 1 ? '3-1-1' : '2-1-1' },
            pull  && { ...applyAdjustments(pull,  sessionLogs, 'pull'),  role: 'Primary',   sets: phase === 1 ? '3' : '4', tempo: phase === 1 ? '3-1-1' : '2-1-1' },
            hinge && { ...applyAdjustments(hinge, sessionLogs, 'hinge'), role: 'Primary',   sets: phase === 1 ? '3' : '4', tempo: phase === 1 ? '3-1-1' : '2-1-1' },
            carry && { ...carry, role: 'Carry', sets: '3', repRange: '40 sec' },
            iso1  && { ...iso1, role: 'Isolation', sets: '2', repRange: `${iso1.repRange} · to failure` },
            iso2  && { ...iso2, role: 'Isolation', sets: '2', repRange: `${iso2.repRange} · to failure` },
          ].filter(Boolean)
        };
      },

      // Thursday: Squat / Rotate / Unilateral
      B: () => {
        const phase = weekNum <= 4 ? 1 : weekNum <= 8 ? 2 : 3;
        const squat  = pickForPattern('squat',  track, equipmentTier, false, false, 1)[0]; // unilateral
        const push   = pickForPattern('push',   track, equipmentTier, false, false, 1)[0]; // unilateral push
        const pull   = pickForPattern('pull',   track, equipmentTier, false, false, 1)[0]; // unilateral pull
        const rotate = pickForPattern('rotate', track, equipmentTier, false, null,  1)[0];
        const iso1   = pickIsolation('shoulder',  equipmentTier); // shoulder after push/pull unilateral
        const iso2b  = pickIsolation('hamstring', equipmentTier); // hamstring after squat/hinge

        const nameB = getSessionName(track, 'B', weekNum) || 'Squat · Rotate · Unilateral';
        return {
          name: nameB,
          type: 'strength',
          day: 'Thursday',
          phase,
          exercises: [
            squat  && { ...applyAdjustments(squat,  sessionLogs, 'squat'),  role: 'Primary',   sets: phase === 1 ? '3' : '4', tempo: '3-1-1' },
            push   && { ...applyAdjustments(push,   sessionLogs, 'push'),   role: 'Unilateral', sets: '3', tempo: 'Controlled' },
            pull   && { ...applyAdjustments(pull,   sessionLogs, 'pull'),   role: 'Unilateral', sets: '3', tempo: '2-1-1' },
            rotate && { ...applyAdjustments(rotate, sessionLogs, 'rotate'), role: 'Rotation',   sets: '3', tempo: 'Slow' },
            iso1   && { ...iso1,  role: 'Isolation', sets: '2', repRange: `${iso1.repRange} · to failure` },
            iso2b  && { ...iso2b, role: 'Isolation', sets: '2', repRange: `${iso2b.repRange} · to failure` },
          ].filter(Boolean)
        };
      },

      // Saturday: Dead Stops + Power + Conditioning
      C: () => {
        const phase = weekNum <= 4 ? 1 : weekNum <= 8 ? 2 : 3;
        const hinge = pickForPattern('hinge', track, equipmentTier, true, true, 1)[0]  // ballistic hinge
                   || pickForPattern('hinge', track, equipmentTier, true, false, 1)[0]; // fallback
        const push  = pickForPattern('push',  track, equipmentTier, true, true, 1)[0]  // ballistic push
                   || pickForPattern('push',  track, equipmentTier, true, false, 1)[0];
        const pull  = pickForPattern('pull',  track, equipmentTier, true, false, 1)[0];
        const carry = pickForPattern('carry', track, equipmentTier, false, null, 1)[0]; // unilateral carry

        const hiit = phase >= 2 ? {
          name: 'Conditioning Finisher',
          pattern: 'cardio',
          role: 'Finisher',
          sets: phase === 2 ? '4' : '5',
          repRange: phase === 2 ? '30 sec · all-out' : '45 sec · all-out',
          tempo: `${phase === 2 ? '90' : '90'} sec rest between`,
          combatValue: 'Aerobic + anaerobic conditioning',
          adjusted: false
        } : null;

        const nameC = getSessionName(track, 'C', weekNum) || 'Dead Stops · Power · Conditioning';
        return {
          name: nameC,
          type: 'strength-cardio',
          day: 'Saturday',
          phase,
          exercises: [
            hinge && { ...applyAdjustments(hinge, sessionLogs, 'hinge'), role: 'Power Hinge', sets: phase === 1 ? '3' : '4', tempo: 'Dead stop + explosive' },
            push  && { ...applyAdjustments(push,  sessionLogs, 'push'),  role: 'Power Push',  sets: '4', tempo: 'Dead stop + explosive' },
            pull  && { ...applyAdjustments(pull,  sessionLogs, 'pull'),  role: 'Tempo Pull',  sets: '3', tempo: '3-1-1' },
            carry && { ...carry, role: 'Carry', sets: '3', repRange: '40 sec' },
            pickIsolation('bicep',  equipmentTier) && { ...pickIsolation('bicep',  equipmentTier), role: 'Isolation', sets: '2', repRange: `${pickIsolation('bicep', equipmentTier)?.repRange} · to failure` },
            hiit,
          ].filter(Boolean)
        };
      },

      // Tuesday: Cardio
      cardio: () => ({
        name: getSessionName(track, 'cardio', weekNum) || 'Zone 2 · Cardio',
        type: 'cardio',
        day: 'Tuesday',
        phase: weekNum <= 4 ? 1 : weekNum <= 8 ? 2 : 3,
        exercises: [
          { name: 'Warm-up', pattern: 'cardio', role: 'Warm-Up', sets: '1', repRange: '5 min easy walk', tempo: '', combatValue: '', adjusted: false },
          { name: 'Zone 2 · Jump Rope or Footwork', pattern: 'cardio', role: 'Zone 2', sets: weekNum <= 4 ? '2' : '1', repRange: weekNum <= 4 ? '10 min / 2 min rest' : '25–30 min continuous', tempo: 'Nose breathe · conversational pace · under 134 bpm', combatValue: 'Mitochondrial density — aerobic base', adjusted: false },
          { name: 'Shadow Boxing', pattern: 'cardio', role: 'Cool Down', sets: '1', repRange: '5–10 min', tempo: 'Loose · no intensity · just move', combatValue: 'Movement pattern reinforcement', adjusted: false },
        ]
      }),

      // Sunday: Mobility
      mobility: () => ({
        name: getSessionName(track, 'mobility', weekNum) || 'Mobility',
        type: 'mobility',
        day: 'Sunday',
        phase: 1,
        exercises: [
          { name: 'Shoulder Complex', pattern: 'mobility', role: 'Shoulders', sets: '2–3', repRange: '30–45 sec each', tempo: 'Slow and relaxed', combatValue: 'Hook arc + shoulder longevity', adjusted: false },
          { name: 'Hip Mobility', pattern: 'mobility', role: 'Hips', sets: '2', repRange: '45 sec/side', tempo: 'Breathe into range', combatValue: 'Cross rotation + footwork range', adjusted: false },
          { name: 'Thoracic Rotation', pattern: 'mobility', role: 'Thoracic', sets: '2', repRange: '10 reps/side', tempo: 'Breath-driven', combatValue: 'Power transfer — hips to hands', adjusted: false },
          { name: 'Breath Work', pattern: 'mobility', role: 'Close', sets: '1', repRange: '5 min', tempo: '4-7-8 pattern', combatValue: 'Parasympathetic reset — fight recovery', adjusted: false },
        ]
      }),
    };

    return sessions[type] ? sessions[type]() : null;
  }

  // ── GENERATE FULL WEEK ──
  function generateWeek(track, equipmentTier, weekNum, sessionLogs) {
    const week = {
      weekNum,
      track,
      equipmentTier,
      generated: new Date().toISOString(),
      sessions: {
        monday:    generateSession('A',       track, equipmentTier, weekNum, sessionLogs),
        tuesday:   generateSession('cardio',  track, equipmentTier, weekNum, sessionLogs),
        wednesday: null, // rest
        thursday:  generateSession('B',       track, equipmentTier, weekNum, sessionLogs),
        friday:    null, // rest
        saturday:  generateSession('C',       track, equipmentTier, weekNum, sessionLogs),
        sunday:    generateSession('mobility',track, equipmentTier, weekNum, sessionLogs),
      }
    };

    // Check for adjustments
    const adjusted = Object.values(week.sessions)
      .filter(Boolean)
      .flatMap(s => s.exercises || [])
      .filter(e => e && e.adjusted);

    week.hasAdjustments = adjusted.length > 0;
    week.adjustmentCount = adjusted.length;

    return week;
  }

  // ── BODYWEIGHT CARRY NOTE ──
  function getCarryNote(equipmentTier) {
    if (equipmentTier === 'bodyweight') {
      return 'Carry pattern is limited with bodyweight only. Marching lunges and bear crawls are substituted — they build similar structural integrity but with less loading. Consider adding bands or light dumbbells when possible.';
    }
    return null;
  }

  // ── PUBLIC API ──
  return {
    generateWeek,
    generateSession,
    filterLibrary,
    getCarryNote,
    getSessionName,
    LIBRARY,
    EQUIPMENT,
  };

})();

// Export for use in other files
</script>
<script>
  // ── STATE ──
  const placement  = JSON.parse(localStorage.getItem('fightme_placement') || '{}');
  const track      = placement.track || 'foundation';
  const equipment  = placement.equipment || 'dumbbells';
  const startDate  = placement.date || new Date().toISOString();
  const sessions   = JSON.parse(localStorage.getItem('fightme_sessions') || '[]');

  function getWeekNum() {
    const start = new Date(startDate);
    const now = new Date();
    const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24 * 7));
    return Math.max(1, Math.min(diff + 1, 12));
  }

  const weekNum = getWeekNum();
  let currentDay = 'monday';

  // ── PATTERN COLORS ──
  const PATTERN_COLORS = {
    push: '#e8311a', pull: '#5aacff', squat: '#28b05a',
    hinge: '#c97b1a', carry: '#b87aff', rotate: '#e87b1a',
    cardio: '#28b05a', mobility: '#b87aff'
  };

  // ── TRACK DESCRIPTIONS ──
  const TRACK_DESC = {
    foundation: 'Built for your <strong>Foundation track</strong> placement — movement quality, connective tissue prep, aerobic base. Loads are moderate. Tempo work dominates. Every session is building something real even when it doesn\'t feel intense.',
    transition:  'Built for your <strong>Transition track</strong> placement — loading the patterns you built, adding unilateral work, introducing variable resistance. Intensity is rising. Your conditioning gaps are being addressed directly.',
    fighter:     'Built for your <strong>Fighter track</strong> placement — hard sets at 80%+, power emphasis, full conditioning protocol. The foundation is there. This is refinement and performance.',
  };

  const EQUIPMENT_LABELS = {
    bodyweight: 'Bodyweight Only',
    bands: 'Bodyweight + Bands',
    dumbbells: 'Dumbbells + Bands',
    full: 'Full Gym'
  };

  // ── GENERATE PROGRAM ──
  const week = PROGRAM_GENERATOR.generateWeek(track, equipment, weekNum, sessions);

  // ── RENDER HEADER ──
  function renderHeader() {
    document.getElementById('program-title').textContent = `Week ${weekNum} Program`;

    const pills = document.getElementById('program-pills');
    const trackClass = `pill-track-${track}`;
    pills.innerHTML = `
      <div class="meta-pill ${trackClass}">${track.charAt(0).toUpperCase() + track.slice(1)}</div>
      <div class="meta-pill pill-equipment">${EQUIPMENT_LABELS[equipment]}</div>
      <div class="meta-pill pill-week">Week ${weekNum} of 12</div>
    `;

    document.getElementById('program-description').innerHTML = TRACK_DESC[track] || '';
  }

  // ── RENDER NOTICES ──
  function renderNotices() {
    const container = document.getElementById('notices');
    let html = '';

    if (week.hasAdjustments) {
      html += `
        <div class="adjustment-notice">
          <div>⚙</div>
          <div>
            <strong>${week.adjustmentCount} exercise${week.adjustmentCount > 1 ? 's' : ''} adjusted</strong>
            The system detected patterns in your recent sessions and shifted your program accordingly. Adjusted exercises are marked below.
          </div>
        </div>`;
    }

    const carryNote = PROGRAM_GENERATOR.getCarryNote(equipment);
    if (carryNote) {
      html += `<div class="carry-note"><strong>Note on Carry pattern:</strong> ${carryNote}</div>`;
    }

    container.innerHTML = html;
  }

  // ── RENDER WEEK STRIP ──
  function renderWeekStrip() {
    const days = [
      { key: 'monday',    label: 'Mon', type: 'strength', icon: '💪' },
      { key: 'tuesday',   label: 'Tue', type: 'cardio',   icon: '🫀' },
      { key: 'wednesday', label: 'Wed', type: 'rest',     icon: '😴' },
      { key: 'thursday',  label: 'Thu', type: 'strength', icon: '💪' },
      { key: 'friday',    label: 'Fri', type: 'rest',     icon: '😴' },
      { key: 'saturday',  label: 'Sat', type: 'strength', icon: '⚡' },
      { key: 'sunday',    label: 'Sun', type: 'mobility', icon: '🧘' },
    ];

    const strip = document.getElementById('week-strip');
    strip.innerHTML = days.map(d => `
      <div class="week-strip-day ${d.key === currentDay ? 'active' : ''}" onclick="switchDay('${d.key}')">
        <div class="wsd-name">${d.label}</div>
        <div class="wsd-block wsd-${d.type}">${d.icon}</div>
        <div class="wsd-type">${d.type}</div>
      </div>
    `).join('');
  }

  // ── RENDER TABS ──
  function renderTabs() {
    const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
    const labels = { monday:'Mon',tuesday:'Tue',wednesday:'Wed',thursday:'Thu',friday:'Fri',saturday:'Sat',sunday:'Sun' };
    const types  = {
      monday:'strength', tuesday:'cardio', wednesday:'rest',
      thursday:'strength', friday:'rest', saturday:'strength', sunday:'mobility'
    };

    const tabBar = document.getElementById('day-tabs');
    tabBar.innerHTML = days.map(d => `
      <button class="day-tab ${d === currentDay ? 'active' : ''}" onclick="switchDay('${d}')">
        <span class="tab-type-dot dot-${types[d]}"></span>${labels[d]}
      </button>
    `).join('');
  }

  // ── RENDER DAY ──
  function renderDayContent(dayKey) {
    const session = week.sessions[dayKey];
    const container = document.getElementById('day-contents');

    if (!session) {
      // Rest day
      const dayName = dayKey.charAt(0).toUpperCase() + dayKey.slice(1);
      container.innerHTML = `
        <div class="day-contents active">
          <div class="rest-day">
            <div class="rest-day-icon">😴</div>
            <div class="rest-day-title">Rest Day</div>
            <div class="rest-day-sub">${dayName} · Full recovery · Mandatory</div>
          </div>
        </div>`;
      return;
    }

    const typeLabel = { strength: 'Strength', 'strength-cardio': 'Strength + Conditioning', cardio: 'Cardio', mobility: 'Mobility' };
    const typeClass = session.type === 'strength-cardio' ? 'strength' : session.type;

    // Check if already logged today
    const today = new Date().toDateString();
    const alreadyLogged = sessions.some(s =>
      new Date(s.date).toDateString() === today &&
      s.day === session.day
    );

    const exercisesHtml = (session.exercises || []).map(ex => {
      if (!ex) return '';
      const dotColor = PATTERN_COLORS[ex.pattern] || '#666';
      const adjClass = ex.adjusted ? 'adjusted' : '';
      const adjTag   = ex.adjusted ? `<div class="adj-tag">adjusted</div>` : '';

      return `
        <div class="exercise-card ${adjClass}">
          <div class="exercise-card-header">
            <div class="exercise-card-left">
              <div class="pattern-dot" style="background:${dotColor}"></div>
              <div class="exercise-name">${ex.name}</div>
            </div>
            <div class="exercise-role">${ex.role || ''}</div>
            ${adjTag}
          </div>
          <div class="exercise-card-body">
            <div class="exercise-stat">
              <div class="stat-label">Sets</div>
              <div class="stat-val">${ex.sets || '3'}</div>
            </div>
            <div class="exercise-stat">
              <div class="stat-label">Reps / Duration</div>
              <div class="stat-val">${ex.repRange || '—'}</div>
            </div>
            <div class="exercise-stat">
              <div class="stat-label">Tempo / Notes</div>
              <div class="stat-val">${ex.tempo || '—'}</div>
            </div>
          </div>
          ${ex.adjustmentNote ? `<div class="exercise-card-note">⚙ ${ex.adjustmentNote}</div>` : ''}
          ${ex.combatValue ? `<div class="combat-value">${ex.combatValue}</div>` : ''}
        </div>`;
    }).join('');

    const logBtnHtml = alreadyLogged
      ? `<button class="log-btn logged">Session Logged ✓</button>`
      : `<button class="log-btn" onclick="logSession('${session.day}', '${session.name}')">Log This Session →</button>`;

    container.innerHTML = `
      <div class="day-contents active">
        <div class="session-header">
          <div class="session-type-label ${typeClass}">${typeLabel[session.type] || session.type}</div>
          <div class="session-name">${session.name}</div>
          <div class="session-meta">${session.day} · Week ${weekNum} · ${track.charAt(0).toUpperCase() + track.slice(1)} Track · ${EQUIPMENT_LABELS[equipment]}</div>
        </div>
        <div class="exercises-list">${exercisesHtml}</div>
        ${logBtnHtml}
      </div>`;
  }

  // ── SWITCH DAY ──
  function switchDay(dayKey) {
    currentDay = dayKey;

    // Update tabs
    document.querySelectorAll('.day-tab').forEach((t, i) => {
      const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
      t.classList.toggle('active', days[i] === dayKey);
    });

    // Update strip
    document.querySelectorAll('.week-strip-day').forEach((d, i) => {
      const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
      d.classList.toggle('active', days[i] === dayKey);
    });

    renderDayContent(dayKey);
  }

  // ── LOG SESSION ──
  function logSession(day, sessionName) {
    const params = new URLSearchParams({
      source: 'fit',
      session: sessionName,
      day: day,
      week: weekNum
    });
    window.location.href = `session-log.html?${params.toString()}`;
  }

  // ── SET TODAY ──
  function setToday() {
    const dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    currentDay = dayNames[new Date().getDay()];
  }

  // ── INIT ──
  function waitForGenerator(cb, attempts) {
    attempts = attempts || 0;
    if (typeof PROGRAM_GENERATOR !== 'undefined') {
      cb();
    } else if (attempts < 50) {
      setTimeout(() => waitForGenerator(cb, attempts + 1), 100);
    } else {
      // Generator failed — show error state
      document.getElementById('day-contents').innerHTML =
        '<div style="padding:40px 20px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.1em">Program generator failed to load.<br><br><a href="fit-me-hub.html" style="color:var(--green)">← Back to fit.me</a></div>';
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    setToday();
    waitForGenerator(() => {
      renderHeader();
      renderNotices();
      renderWeekStrip();
      renderTabs();
      renderDayContent(currentDay);
    });
  });
  // Also try immediately in case DOM already loaded
  if (document.readyState !== 'loading') {
    setToday();
    waitForGenerator(() => {
      renderHeader();
      renderNotices();
      renderWeekStrip();
      renderTabs();
      renderDayContent(currentDay);
    });
  }
</script>
</body>
</html>
